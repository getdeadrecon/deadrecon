<!doctype html>
<!--
  Source for deadrecon-social.png (1280x640 OG/Twitter card).
  Regenerate from this directory with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1280,640 \
      --virtual-time-budget=4000 \
      --screenshot=deadrecon-social.png \
      "file://$PWD/deadrecon-social.src.html"

  Reuses deadrecon-card.svg (the XIII tarot art) for the right panel.
  Fonts load from Google Fonts, so a network connection is needed when rendering.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --fg:#fff; --red:#ff3b1f; --gold:#f7de52; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:640px; background:var(--bg); overflow:hidden; }
  .stage{ position:relative; width:1280px; height:640px; background:var(--bg); }

  /* full-width red censor bar: behind the wordmark, over the card */
  .redbar{ position:absolute; left:0; right:0; top:300px; height:46px; background:var(--red); z-index:1; }

  .wm{
    position:absolute; top:138px; left:64px; z-index:2;
    font-family:"Archivo Black", system-ui, sans-serif;
    font-size:134px; line-height:1; letter-spacing:-2px; white-space:nowrap;
    transform:scaleX(0.80); transform-origin:left center;
  }
  .wm .w{ color:var(--fg); }
  .wm .r{ color:var(--red); }

  .sub{
    position:absolute; top:392px; left:66px; z-index:2;
    font-family:"Archivo", system-ui, sans-serif; font-weight:800;
    font-size:42px; line-height:1.28; color:var(--fg); letter-spacing:-0.5px;
  }
  .install{
    position:absolute; top:560px; left:66px; z-index:2;
    font-family:"JetBrains Mono", ui-monospace, monospace; font-weight:600;
    font-size:30px; color:var(--gold); letter-spacing:0.5px;
  }
  .card{
    position:absolute; top:56px; right:72px; height:528px; width:auto; z-index:0;
    image-rendering:pixelated;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="redbar"></div>
    <h1 class="wm"><span class="w">DEAD</span><span class="r">RECON</span></h1>
    <p class="sub">Strips the target to bare metal.<br>Leaves your name out of it.</p>
    <p class="install">pip install deadrecon&nbsp;&nbsp;·&nbsp;&nbsp;deadrecon.sh</p>
    <img class="card" src="deadrecon-card.svg" alt="">
  </div>
</body>
</html>
