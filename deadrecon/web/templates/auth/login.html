{% extends "base.html" %}
{% block title %}Sign in — DeadRecon{% endblock %}
{% block content %}
<div style="max-width:24rem;margin:4rem auto;padding:0 1rem;">
  <h1 style="margin-bottom:1.5rem;">Sign in</h1>
  <form action="{{ url_for('auth.login') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_path }}">
    <div class="form-group" style="margin-bottom:0.75rem;">
      <label class="form-label" for="username">USERNAME</label>
      <input class="input-field" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group" style="margin-bottom:1.25rem;">
      <label class="form-label" for="password">PASSWORD</label>
      <input class="input-field" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
