version: "3.9"

services:
  phantomsignal:
    build: .
    image: phantomsignal:latest
    container_name: phantomsignal
    ports:
      # Loopback only. Publish more widely only behind a TLS reverse proxy, and
      # set PHANTOMSIGNAL_SECURE_COOKIES=true + PHANTOMSIGNAL_ALLOWED_ORIGINS.
      - "127.0.0.1:5000:5000"
    volumes:
      - phantomsignal-data:/app/data
      - phantomsignal-exports:/app/exports
      # API keys, console settings and the session key saved at runtime
      - phantomsignal-home:/root/.phantomsignal
      - ./config:/app/config:ro
    environment:
      - PHANTOMSIGNAL_HOST=0.0.0.0
      - PHANTOMSIGNAL_PORT=5000
      - PHANTOMSIGNAL_DB_URL=sqlite:////app/data/phantomsignal.db
      - PHANTOMSIGNAL_EXPORT_DIR=/app/exports
      # Add your API keys as environment variables:
      # - SHODAN_API_KEY=your-key
      # - VIRUSTOTAL_API_KEY=your-key
      # - HUNTER_API_KEY=your-key
      # - HIBP_API_KEY=your-key
      # - GREYNOISE_API_KEY=your-key
      # - IPINFO_TOKEN=your-token
      # - ABUSEIPDB_API_KEY=your-key
      # - ALIENVAULT_API_KEY=your-key
      # - GITHUB_TOKEN=your-token
      # - SECURITYTRAILS_API_KEY=your-key
      # - URLSCAN_API_KEY=your-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Tor proxy for covert scans
  tor:
    image: dperson/torproxy:latest
    container_name: phantomsignal-tor
    ports:
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:8118:8118"
    restart: unless-stopped
    profiles: ["covert"]

volumes:
  phantomsignal-data:
  phantomsignal-exports:
  phantomsignal-home:
