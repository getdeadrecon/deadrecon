name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: pip install build -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package contents
        run: python scripts/check_package.py dist/*.whl dist/*.tar.gz

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import phantomsignal; print(phantomsignal.__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version : $PKG_VERSION"
          echo "Tag version     : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: version mismatch — bump __version__ and setup.py before tagging"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # API-token auth (PYPI_API_TOKEN repo secret). Attestations require
          # OIDC trusted publishing, so they're off under token auth.
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
