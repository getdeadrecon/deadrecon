name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Import check
        run: |
          python -c "import phantomsignal; print('v' + phantomsignal.__version__)"
          python -c "from phantomsignal.core.config import PhantomSignalConfig"
          python -c "from phantomsignal.core.models import Scan"
          python -c "from phantomsignal.intel.apis.base import BaseIntelAPI, get_registered_apis"
          python -c "import phantomsignal.intel.apis.all_apis; from phantomsignal.intel.apis.base import get_registered_apis; assert len(get_registered_apis()) > 0"

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest pytest-asyncio -q
            pytest tests/ -v
          else
            echo "No test suite yet — import check passed."
          fi

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          pip install build -q
          python -m build

      - name: Check package contents
        run: python scripts/check_package.py dist/*.whl dist/*.tar.gz

      - name: Install the wheel and load its data files
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/clean/bin/phantomsignal --help > /dev/null
          /tmp/clean/bin/python -c "from phantomsignal.intel.signatures.engine import load_templates; assert load_templates(); from phantomsignal.web.app import create_app; create_app()"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -t phantomsignal:ci .

      - name: Start and check health
        run: |
          docker run -d --name phantomsignal-ci -p 127.0.0.1:5000:5000 phantomsignal:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:5000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs phantomsignal-ci
          exit 1

      - name: Build with the optional recon tools
        run: |
          docker build --build-arg RECON_TOOLS=true -t phantomsignal:ci-tools .
          for tool in nuclei katana subfinder naabu tlsx; do
            docker run --rm --entrypoint "$tool" phantomsignal:ci-tools -version
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install flake8
        run: pip install flake8 -q

      - name: Flake8
        run: flake8 phantomsignal/ --max-line-length=120 --extend-ignore=E501,W503,E203
